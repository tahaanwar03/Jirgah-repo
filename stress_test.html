<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jirgah Stress Test Tool</title>
    <!-- Path from project root -->
    <script src="config/config.js"></script>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #131313; color: white; }
        .card { background: #1c1b1b; padding: 2rem; border-radius: 1rem; border: 1px solid #333; max-width: 600px; margin: auto; }
        button { background: #f2ca50; color: #3c2f00; border: none; padding: 1rem 2rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #logs { background: black; padding: 1rem; border-radius: 0.5rem; height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; margin-top: 1rem; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .info { color: #f2ca50; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Jirgah Stress Test</h1>
        <p>This tool will send 20 orders <strong>sequentially</strong> (one-by-one) to test data integrity and backend reliability without triggering browser congestion.</p>
        <div style="margin-bottom: 1rem;">
            <strong>Target URL:</strong> <span id="url-display" class="info">Loading...</span>
        </div>
        <button id="start-btn" onclick="startTest()">Start High-Volume Test (20 Orders)</button>
        <div id="logs"></div>
    </div>

    <script>
        // Ensure config is loaded
        window.onload = () => {
            const config = window.JIRGAH_CONFIG;
            if (!config || !config.GAS_URL) {
                document.getElementById('url-display').textContent = 'ERROR: No GAS_URL found in config/config.js';
                document.getElementById('url-display').classList.replace('info', 'error');
                document.getElementById('start-btn').disabled = true;
            } else {
                document.getElementById('url-display').textContent = config.GAS_URL;
            }
        };

        const log = (msg, type='') => {
            const el = document.getElementById('logs');
            el.innerHTML += `<div class="${type}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            el.scrollTop = el.scrollHeight;
        };

        async function startTest() {
            const config = window.JIRGAH_CONFIG;
            if (!confirm('This will send 20 orders sequentially. Proceed?')) return;
            
            document.getElementById('start-btn').disabled = true;
            log('Starting high-volume sequential test...', 'info');

            let successCount = 0;
            let failCount = 0;

            for (let i = 1; i <= 20; i++) {
                const orderId = `VOL-${Date.now()}-${i}`;
                const payload = {
                    OrderID: orderId,
                    Timestamp: new Date().toISOString(),
                    CustomerName: `Volume Tester ${i}`,
                    Phone: '03001234567',
                    Address: '123 Test Street',
                    Items: JSON.stringify([{ name: 'Test Item', price: 100, quantity: 1 }]),
                    Total: 100,
                    Notes: 'High volume test',
                    apiKey: config.API_KEY
                };

                log(`[${i}/20] Processing ${orderId}...`);
                
                try {
                    const response = await fetch(config.GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });
                    const res = await response.json();
                    
                    if (res.status === 'success') {
                        log(`✅ Success: ${orderId}`, 'success');
                        successCount++;
                    } else {
                        log(`❌ Backend Error: ${res.message}`, 'error');
                        failCount++;
                    }
                } catch (err) {
                    log(`❌ Network/CORS Error: ${err.message}`, 'error');
                    failCount++;
                }
                
                // 400ms pause to let Google breathe between writes
                await new Promise(r => setTimeout(r, 400));
            }
            
            log(`Test Complete. Success: ${successCount}, Failed: ${failCount}`, 'info');
            document.getElementById('start-btn').disabled = false;
        }
    </script>
</body>
</html>
